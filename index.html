<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sombra e Água Fresca</title>
  <meta name="description" content="Um jogo em pixel sobre sair da Caverna de Platão, com filósofos demais e humor de sobra." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b1020'/%3E%3Crect x='6' y='3' width='4' height='4' fill='%23ffb347'/%3E%3Crect x='5' y='7' width='6' height='6' fill='%23ff7a3d'/%3E%3Crect x='7' y='9' width='2' height='3' fill='%23ffe08a'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #0d0710; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #toque { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
    #toque.ativo { display: flex; }
    #toque .grupo { display: grid; gap: 6px; pointer-events: auto; }
    #toque .dpad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
    #toque .acoes { grid-template-columns: repeat(2, 56px); align-content: end; }
    #toque button { font: 600 14px 'Pixelify Sans', monospace; color: #ffe8c2; background: #2a1830cc; border: 2px solid #ff9a52; border-radius: 6px; touch-action: none; -webkit-user-select: none; user-select: none; }
    #toque button:active { background: #ff9a52; color: #1b1020; }
    /* celular deitado: controles nas laterais, centralizados na altura */
    @media (orientation: landscape) {
      #toque { inset: 0; align-items: center; padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right)); }
      #toque .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); }
      #toque .acoes { grid-template-columns: 64px; grid-template-rows: repeat(2, 52px); }
    }
    /* celular em pé: o jogo fica em cima e os controles embaixo */
    @media (orientation: portrait) {
      body.toque { align-items: flex-start; padding-top: max(16px, env(safe-area-inset-top)); box-sizing: border-box; }
    }
    #gire { display: none; position: fixed; left: 12px; right: 12px; bottom: 210px; padding: 12px 14px; font: 500 15px/1.35 'Pixelify Sans', monospace; color: #ffe8c2; background: #2a1830; border: 2px solid #ff9a52; border-radius: 8px; text-align: center; }
    #gire button { margin-top: 8px; font: 600 14px 'Pixelify Sans', monospace; color: #1b1020; background: #ff9a52; border: 0; border-radius: 6px; padding: 6px 12px; }
    @media (orientation: portrait) { body.toque #gire:not(.dispensado) { display: block; } }
  </style>
</head>
<body>
  <canvas id="tela" aria-label="Sombra e Água Fresca"></canvas>
  <div id="gire">Fica melhor com o celular deitado: o texto cresce e os botões vão para os lados.<br /><button type="button">Jogar em pé mesmo</button></div>
  <div id="toque" aria-hidden="true">
    <div class="grupo dpad">
      <span></span><button data-k="ArrowUp">▲</button><span></span>
      <button data-k="ArrowLeft">◀</button><span></span><button data-k="ArrowRight">▶</button>
      <span></span><button data-k="ArrowDown">▼</button><span></span>
    </div>
    <div class="grupo acoes">
      <button data-k="Tab">Álbum</button><button data-k="Enter">Ok</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
